services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetifier
      POSTGRES_USER: meetifier
      POSTGRES_PASSWORD: meetifier
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetifier"]
      interval: 3s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetifier:meetifier@db:5432/meetifier
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:

