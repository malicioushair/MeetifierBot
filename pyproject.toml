[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "meetifier-bot"
version = "0.1.0"
description = "Two Telegram calendar bots with durable reminders"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.22.0",
  "SQLAlchemy==2.0.43",
  "aiosqlite==0.21.0",
  "asyncpg==0.30.0",
  "python-dotenv==1.1.1",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
